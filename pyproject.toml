[project]
name = "debt-snowball"
requires-python = "==3.12.*"
dynamic = ["version"]

dependencies = [
    "python-dateutil~=2.9.0",
    "jinja2~=3.1.6",
    "werkzeug~=3.1.4",
]

# [tool.mypy]
# mypy_path = "src"

[tool.black]
line_length = 150

[tool.isort]
line_length = 150
profile = "black"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "black~=25.12.0",
    "isort~=7.0.0",
    "pytest-env~=1.1",
    "pytest-mock~=3.15.0",
    "pytest-rerunfailures~=15.1,<16",
    "pytest-xdist~=3.8.0",
    "pytest~=9.0.0",
    "coverage~=7.13.1",
]
